{{- if eq (include "chatto.manageNatsSecret" .) "true" }}
{{- $name := include "chatto.natsSecretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $prev := dict -}}
{{- if $existing }}{{- $prev = $existing.data -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "chatto.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.nats.enabled }}
  {{- /*
  Bundled NATS: shared token, auto-generated and persisted if blank.

  The token reaches nats-server as `token: $NATS_TOKEN` in its config file
  (values.yaml, nats.config.merge.authorization), and nats-server re-parses the
  expanded value as a config token. A bare value that looks like a number is
  therefore a parse error, not a string: a plain sha256 hex token starting
  `<digits>e` reads as scientific notation and the server exits with
  "variable reference for 'NATS_TOKEN' could not be parsed" — roughly one fresh
  install in eight. Quoting it in the config is NOT a fix: nats-server then
  stops expanding the variable and every deployment silently shares the literal
  password `$NATS_TOKEN`.

  So generated tokens carry a leading letter, which makes the value
  unambiguously a string. Provided tokens are guarded below instead of being
  rewritten, since rewriting one would break the NATS side.
  */}}
  {{- if and .Values.natsAuth.token (regexMatch "^[0-9]+([eE]|$)" .Values.natsAuth.token) }}
  {{- fail "natsAuth.token starts with digits followed by 'e' (or is all digits), which nats-server parses as a number rather than a string and rejects at startup. Start the token with a letter, or leave it blank to have the chart generate one." }}
  {{- end }}
  token: {{ include "chatto.reuseOrGen" (dict "prev" $prev "key" "token" "provided" .Values.natsAuth.token "prefix" "n") | quote }}
  {{- else }}
  {{- /* External NATS with inline credentials. */}}
  {{- $auth := .Values.externalNats.auth }}
  {{- if eq $auth.method "token" }}
  token: {{ required "externalNats.auth.token is required for method=token" $auth.token | quote }}
  {{- else if eq $auth.method "userpass" }}
  username: {{ required "externalNats.auth.username is required for method=userpass" $auth.username | quote }}
  password: {{ required "externalNats.auth.password is required for method=userpass" $auth.password | quote }}
  {{- else if eq $auth.method "credentials" }}
  credentials: {{ required "externalNats.auth.credentials is required for method=credentials" $auth.credentials | quote }}
  {{- else if eq $auth.method "nkey" }}
  nkeySeed: {{ required "externalNats.auth.nkeySeed is required for method=nkey" $auth.nkeySeed | quote }}
  {{- end }}
  {{- end }}
{{- end }}
