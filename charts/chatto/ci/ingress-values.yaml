# chart-testing (ct) case: exercises the ingress, autoscaling, metrics and
# networkPolicy code paths that ct-values.yaml leaves off.
#
# Everything here must install on a bare kind cluster, so it deliberately avoids
# anything needing a CRD (serviceMonitor), an external service (S3, SMTP,
# LiveKit), or a real ingress controller — the Ingress object is created but
# never reconciled, which is enough to catch template regressions.
chatto:
  url: https://chat.ci.example.com
  metrics:
    enabled: true
  owners:
    emails: admin@ci.example.com
  # Transcoding is CPU-hungry; nothing in the smoke test uploads video.
  video:
    enabled: false
  webserver:
    # Covers CHATTO_WEBSERVER_TRUSTED_PROXIES rendering and the chart's
    # IP/CIDR validation. kind's pod CIDR; nothing here forwards through a real
    # proxy, so this only asserts Chatto accepts the value at startup rather
    # than exiting on a parse error.
    trustedProxies:
      - 10.244.0.0/16
      - fd00:10:244::/56
    # Non-default values on both knobs, so a regression that swaps or drops
    # them shows up.
    apiCompression:
      enabled: false
      minBytes: 2048

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: chat.ci.example.com
      paths:
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# kind's default CNI does not enforce NetworkPolicy, so this only asserts that
# the object renders and is accepted by the API server.
networkPolicy:
  enabled: true

# minAvailable=1 against a single autoscaled replica would block ct's teardown.
podDisruptionBudget:
  enabled: false

nats:
  config:
    cluster:
      enabled: false
    jetstream:
      fileStore:
        pvc:
          size: 1Gi
  container:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
